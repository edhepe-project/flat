<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;">
  <meta name="description" content="TerraPlana 3D Pro: Simulador astronómico interactivo 3D basado en proyección azimutal equidistante con cálculo de declinación solar, lunar, analemas y herramientas geodésicas.">
  <meta name="keywords" content="terraplana, simulador 3d, astronomia, azimutal equidistante, analema, declinacion solar, threejs">
  <title>TerraPlana 3D Pro · Simulador de Órbitas y Geometría</title>
  
  <!-- Favicon SVG moderno inline -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%230b1329' stroke='%2338bdf8' stroke-width='4'/><circle cx='50' cy='50' r='28' fill='none' stroke='%23e7b24b' stroke-dasharray='4,4' stroke-width='2'/><circle cx='32' cy='42' r='7' fill='%23e7b24b'/><circle cx='68' cy='58' r='5' fill='%23afcbe0'/></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Three.js & Plugins (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>
  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Contenedores para Inyección Dinámica de Componentes HTML -->
  <div id="header-root"></div>
  <div id="sidebar-root"></div>
  <div id="widgets-root"></div>

  <!-- Core: Parsers y cálculos astronómicos -->
  <script src="js/core/geo-parser.js"></script>
  <script src="js/core/astro-math.js"></script>
  <script src="js/core/ephemeris.js"></script>

  <!-- Capas independientes -->
  <script src="js/layers/measure-tool.js"></script>
  <script src="js/layers/pins-manager.js"></script>
  <script src="js/layers/countries-layer.js"></script>
  <script src="js/layers/arctic-layer.js"></script>
  <script src="js/layers/grid-weather.js"></script>
  <script src="js/layers/night-city-lights.js"></script>

  <!-- Catálogo Estelar Real (Yale BSC5 + IAU) -->
  <script src="js/data/celestial-catalog.js"></script>

  <!-- Submódulos de EarthDisc & CelestialSystem -->
  <script src="js/celestial/firmament.js"></script>
  <script src="js/celestial/luminaries.js"></script>
  <script src="js/celestial/ambient-lighting.js"></script>
  <script src="js/celestial/trails-analema.js"></script>

  <!-- Submódulos de NavigationControls -->
  <script src="js/controls/observer-mode.js"></script>
  <script src="js/controls/raycast-interaction.js"></script>

  <!-- Submódulos de UIManager -->
  <script src="js/ui/search-autocomplete.js"></script>
  <script src="js/ui/hud-manager.js"></script>
  <script src="js/ui/coord-modal.js"></script>
  <script src="js/ui/layer-controls.js"></script>
  <script src="js/ui/sim-controls.js"></script>
  <script src="js/ui/time-travel.js"></script>
  <script src="js/ui/places-panel.js"></script>
  <script src="js/ui/measure-panel.js"></script>

  <!-- Orquestadores principales -->
  <script src="js/earth-disc.js"></script>
  <script src="js/celestial.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>

  <!-- Loader de Componentes: Inyecta HTML y arranca la aplicación -->
  <script src="js/ui/component-loader.js"></script>
</body>
</html>
